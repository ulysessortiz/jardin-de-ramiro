name: Owner feature audit

on:
  push:
    branches: [owner-feature-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unpack protected pass
        run: node apply-pass.mjs
      - name: Inspect owner role implementation
        shell: bash
        run: |
          echo '=== CORE AUTH CONTEXT ==='
          grep -n -C 12 -E 'authContext|isOwner|roles|requireOwner' netlify/lib/core.mjs || true
          echo '=== IDENTITY EVENT ==='
          cat netlify/functions/identity.mjs || true
          echo '=== OWNER BOOTSTRAP SOURCE ==='
          cat owner-role-activation.mjs || true
          echo '=== ACCOUNT MODE SWITCH ==='
          grep -n -C 8 -E "state.mode|mode:'owner'|mode:'member'|renderOwnerSection|Owner Command" assets/account-source.mjs || true
      - name: Inspect installed Identity SDK contract
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo '=== UPDATE USER SDK REFERENCES ==='
          grep -Rni -C 5 -E 'updateUser|appMetadata|app_metadata' node_modules/@netlify/identity 2>/dev/null | head -n 500 || true
