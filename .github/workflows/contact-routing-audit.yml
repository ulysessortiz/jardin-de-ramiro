name: Protected contact routing audit

on:
  push:
    branches: [protected-contact-routing-2026-10-15]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unpack protected pass
        run: node apply-pass.mjs
      - name: Inspect contact and QR references
        shell: bash
        run: |
          echo '=== PHONE / SMS / TEL / CONTACT REFERENCES ==='
          grep -RniE -C 3 '(tel:|sms:|phone|call|text|voicemail|657[- .()]?266[- .()]?9726|business-card-qr|src=)' --exclude-dir=.git --exclude='*.map' . || true
