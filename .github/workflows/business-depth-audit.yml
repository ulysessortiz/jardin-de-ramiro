name: Business depth audit

on:
  push:
    branches: [business-depth-audit-2026-10-15]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unpack protected pass
        run: node apply-pass.mjs
      - name: Inspect business schema and data constraints
        shell: bash
        run: |
          echo '=== MIGRATION FILES ==='
          find netlify -maxdepth 3 -type f | sort
          echo '=== RAMIRO MIGRATION ==='
          for f in netlify/migrations/*ramiro* netlify/migrations/*20261014090000*; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done
          echo '=== JOB / DOCUMENT / PROFILE DDL ==='
          grep -RniE -C 10 'CREATE TABLE.*ramiro_(profiles|leads|quotes|jobs|documents|payments|job_costs)|ramiro_jobs|ramiro_documents|ramiro_profiles' netlify 2>/dev/null | head -n 2400 || true
